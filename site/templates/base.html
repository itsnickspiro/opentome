<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ title }}</title>
<meta name="description" content="OpenTome — a multi-market volume catalogue for manga, light novels, manhwa and webtoons: per-volume release dates, ISBNs and stable ids, as one SQLite file.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect x='2' y='4' width='4' height='14' rx='1' fill='%231f1c17'/%3E%3Crect x='8' y='2' width='4' height='16' rx='1' fill='%23a63a26'/%3E%3Crect x='14' y='5' width='4' height='13' rx='1' fill='%231f1c17'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap">
<link rel="stylesheet" href="{{ root }}static/style.css">
</head>
<body>
<header class="site-header">
  <a class="wordmark" href="{{ home }}" aria-label="OpenTome home">
    <svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true"><rect x="2" y="4" width="4" height="14" rx="1" fill="currentColor"/><rect x="8" y="2" width="4" height="16" rx="1" class="accent"/><rect x="14" y="5" width="4" height="13" rx="1" fill="currentColor"/></svg>
    <span>OpenTome</span>
  </a>
  <nav class="site-nav" aria-label="Site">
    <a href="{{ home }}"{{ cur_home }}>Home</a>
    <a href="{{ root }}data/"{{ cur_data }}>Data</a>
    <a href="{{ root }}contribute/"{{ cur_contribute }}>Contribute</a>
    <a href="{{ root }}changelog/"{{ cur_changelog }}>Changelog</a>
    <a href="{{ root }}browse/"{{ cur_browse }}>Browse</a>
  </nav>
</header>
<main{{ main_class }}>
{{ body }}
</main>
<footer class="site-footer">
  <p>Data <a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a> as far as the compilation is ours; each source's own terms control the fields that came from it. Code <a href="{{ code_url }}/blob/main/LICENSE">MIT</a>.</p>
  <p><a href="{{ code_url }}">github.com/itsnickspiro/opentome</a> · <a href="{{ discord_url }}">Discord</a> · build <span class="label">{{ build_label }}</span></p>
</footer>
</body>
</html>
